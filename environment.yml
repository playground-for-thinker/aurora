# notebook.link environment for the Delhi smog story map (JupyterGIS, runs in the browser).
# Regenerate the lock file after editing:  mambajs create-lock environment.yml nblink-lock.json
name: delhi-aq-storymap
channels:
  - https://prefix.dev/emscripten-forge-4x
  - https://prefix.dev/conda-forge
dependencies:
  - xeus-python      # Python kernel compiled to WebAssembly (lets you open the .jGIS from a notebook)
  - jupytergis-lite  # JupyterGIS editor + story map viewer for the .jGIS documents
  - specta           # notebook.link presentation mode (full-screen story map, storyboard article)
  - matplotlib       # charts in storyboard_{ko,en}.ipynb
